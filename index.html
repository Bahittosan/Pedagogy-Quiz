<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Жоғары мектепті реформалау — викторина</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg1: #1f3a93;
    --bg2: #3a6ea5;
    --card-bg: #f7f8fc;
    --text: #1a1a1a;
    --panel-bg: #ffffff;
    --accent: #2d5aa0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --card-bg: #24263a;
      --text: #eee;
      --panel-bg: #171826;
    }
  }
  :root[data-theme="dark"] {
    --card-bg: #24263a;
    --text: #eee;
    --panel-bg: #171826;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    margin: 0;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    min-height: 100%;
    color: var(--text);
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
    background: var(--panel-bg);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  h1 {
    text-align: center;
    color: var(--accent);
    margin-top: 0;
    font-size: 20px;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .topbar button {
    background: #888;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  .progress {
    text-align: center;
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .score {
    text-align: center;
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .batch {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .qcard {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 16px;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .qterm {
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 10px;
    color: var(--accent);
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    background: var(--panel-bg);
    border: 2px solid #b9c6e0;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    user-select: none;
  }
  .option:active { transform: scale(0.99); }
  .option.correct { background: #c6f6d5 !important; border-color: #38a169 !important; color: #14532d; }
  .option.wrong { background: #fed7d7 !important; border-color: #e53e3e !important; color: #7f1d1d; }
  .option.disabled { pointer-events: none; opacity: 0.85; }
  .next-hint {
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
    color: var(--accent);
    min-height: 20px;
  }
  .final { text-align: center; }
  .final .score-big { font-size: 24px; font-weight: bold; color: var(--accent); margin: 18px 0; }
  .final .thanks { font-size: 22px; margin-bottom: 24px; }
  .final button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>

const BATCH_SIZE = 5;
const NUM_OPTIONS = 5;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let order = [];
let batchIndex = 0;
let totalScore = 0;
let answeredInBatch = 0;
let batchOptionsCache = [];

function startGame() {
  order = shuffle(data.map((_, i) => i));
  batchIndex = 0;
  totalScore = 0;
  renderBatch();
}

function currentBatchIndices() {
  const start = batchIndex * BATCH_SIZE;
  return order.slice(start, start + BATCH_SIZE);
}

function buildOptionsFor(correctIdx) {
  const others = data.map((_, i) => i).filter(i => i !== correctIdx);
  const distractorCount = Math.min(NUM_OPTIONS - 1, others.length);
  const distractors = shuffle(others).slice(0, distractorCount);
  return shuffle([correctIdx, ...distractors]);
}

function renderBatch() {
  const app = document.getElementById('app');
  const indices = currentBatchIndices();

  if (indices.length === 0) {
    renderFinal();
    return;
  }

  answeredInBatch = 0;
  batchOptionsCache = indices.map(correctIdx => buildOptionsFor(correctIdx));

  const totalBatches = Math.ceil(data.length / BATCH_SIZE);
  app.innerHTML = `
    <h1>Жоғары мектепті реформалау — викторина</h1>
    <div class="topbar">
      <div></div>
      <button onclick="startGame()">Қайта бастау</button>
    </div>
    <div class="progress">Топ: ${batchIndex + 1} / ${totalBatches} (сұрақ ${batchIndex * BATCH_SIZE + 1}–${batchIndex * BATCH_SIZE + indices.length} / ${data.length})</div>
    <div class="score" id="scoreLine">Ұпай: ${totalScore}</div>
    <div class="batch" id="batchDiv"></div>
    <div class="next-hint" id="nextHint"></div>
  `;

  const batchDiv = document.getElementById('batchDiv');
  indices.forEach((correctIdx, qPos) => {
    const item = data[correctIdx];
    const options = batchOptionsCache[qPos];

    const card = document.createElement('div');
    card.className = 'qcard';
    card.dataset.qpos = qPos;

    const termDiv = document.createElement('div');
    termDiv.className = 'qterm';
    termDiv.textContent = `${batchIndex * BATCH_SIZE + qPos + 1}. ${item.term}`;
    card.appendChild(termDiv);

    const optsDiv = document.createElement('div');
    optsDiv.className = 'options';
    options.forEach(optIdx => {
      const optItem = data[optIdx];
      const optDiv = document.createElement('div');
      optDiv.className = 'option';
      optDiv.textContent = optItem.def;
      optDiv.onclick = () => onOptionClick(qPos, optIdx, correctIdx, optDiv, card);
      optsDiv.appendChild(optDiv);
    });
    card.appendChild(optsDiv);
    batchDiv.appendChild(card);
  });
}

function onOptionClick(qPos, chosenIdx, correctIdx, el, cardEl) {
  if (cardEl.dataset.answered === '1') return;
  cardEl.dataset.answered = '1';

  const optionEls = cardEl.querySelectorAll('.option');
  optionEls.forEach(o => o.classList.add('disabled'));

  if (chosenIdx === correctIdx) {
    el.classList.add('correct');
    totalScore += 1;
  } else {
    el.classList.add('wrong');
    optionEls.forEach(o => {
      if (o.textContent === data[correctIdx].def) o.classList.add('correct');
    });
  }

  document.getElementById('scoreLine').textContent = `Ұпай: ${totalScore}`;
  answeredInBatch++;

  const totalInBatch = currentBatchIndices().length;
  if (answeredInBatch >= totalInBatch) {
    document.getElementById('nextHint').textContent = 'Келесі 5 сұраққа өтеміз...';
    setTimeout(() => {
      batchIndex++;
      renderBatch();
    }, 1400);
  }
}

function renderFinal() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="final">
      <h1>Викторина аяқталды!</h1>
      <div class="score-big">Сіздің қорытынды баллыңыз: ${totalScore} / ${data.length}</div>
      <div class="thanks">Қатысқаныңыз үшін рахмет! 🙏</div>
      <button onclick="startGame()">Қайта ойнау</button>
    </div>
  `;
}

startGame();
</script>
</body>
</html>
